<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping list</title>
  </head>
  <body data-page="shopping-list">
    <load src="./partials/header.html" icon-path="img/sprite.svg#logo" />
    <a href="./index.html">HOME</a>
    <main>
      <section class="shopping-list">
        <div class="container shopping-list-container">
          <load src="./partials/support.html" />
          <div class="shopping-list-content">
            <div class="shopping-list-books">
              <h1 class="main-title main-title-shoppin-list">
                Shopping<span>List</span>
              </h1>
              <ul id="books-list" class="books-list"></ul>
              <div class="shop-list-empty is-hidden">
                <p class="shop-list-empty-message">
                  This page is empty, add some books and proceed to order.
                </p>
                <picture class="shop-list-empty-img">
                  <source
                    srcset="
                      ./img/shopping-list/books-des-tablet.webp    1x,
                      ./img/shopping-list/books-des-tablet@2x.webp 2x
                    "
                    media="(min-width: 1440px)"
                  />
                  <source
                    srcset="
                      ./img/shopping-list/books-des-tablet.webp    1x,
                      ./img/shopping-list/books-des-tablet@2x.webp 2x
                    "
                    media="(min-width: 768px)"
                  />
                  <source
                    srcset="
                      ./img/shopping-list/books-mobile.webp    1x,
                      ./img/shopping-list/books-mobile@2x.webp 2x
                    "
                    media="(max-width: 767px)"
                  />
                  <img
                    class="shop-list-empty-img"
                    src="./img/shopping-list/books-des-tablet.webp"
                    alt="Books image"
                    width="265"
                    height="198"
                  />
                </picture>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
