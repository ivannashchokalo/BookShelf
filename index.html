<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/BookShelf/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book shelf</title>
    <script type="module" crossorigin src="/BookShelf/assets/vendor-D9UGMLfO.js"></script>
    <script type="module" crossorigin src="/BookShelf/assets/main-fDWLdXrX.js"></script>
    <link rel="stylesheet" crossorigin href="/BookShelf/assets/main-3zFqBSJI.css">
    <link rel="stylesheet" crossorigin href="/BookShelf/assets/vendor-C6_ZQafJ.css">
  </head>
  <body data-page="home">
    <header class="header">
  <div class="container"></div>
</header>

    <a href="./shopping-list.html">Shopping list</a>
    <main>
      <section class="main-section">
        <div class="container main-section-container">
          <div class="categories">
            <ul class="categories-list"></ul>
          </div>
          <div class="support-wrapper">
  <div class="support-title">
    <span class="support-paragraph">Support Ukraine</span>
    <svg class="ukraine-emblem" width="20" height="32">
      <use href="/BookShelf/assets/symbol-defs-1qghD2SQ.svg#icon-support-title-symbol"></use>
    </svg>
  </div>
  <div class="swiper-container">
    <div class="swiper">
      <div class="swiper-wrapper"></div>
    </div>
  </div>
  <button
    class="support-swiper-btn"
    type="button"
    aria-label="Scroll more funds"
  >
    <svg class="swiper-button-icon">
      <use href="/BookShelf/assets/symbol-defs-1qghD2SQ.svg#icon-Vector"></use>
    </svg>
  </button>
</div>


          <div class="books">
            <h1 class="main-title">Best Sellers <span>Books</span></h1>
            <span class="loader"></span>
            <ul class="main-books-list" data-booklist="top-books"></ul>
            <div class="list-empty">
  <p class="list-empty-message list-empty-message-shopping">
    This page is empty, add some books and proceed to order.
  </p>
  <p class="list-empty-message list-empty-message-home">
    This page is empty. There aren't any books.
  </p>
  <picture class="list-empty-img">
    <source
      srcset="/BookShelf/assets/books-des-tablet-H5_jeGOx.webp 1x, /BookShelf/assets/books-des-tablet@2x-B2ygGSUH.webp 2x"
      media="(min-width: 1440px)"
    />
    <source
      srcset="/BookShelf/assets/books-des-tablet-H5_jeGOx.webp 1x, /BookShelf/assets/books-des-tablet@2x-B2ygGSUH.webp 2x"
      media="(min-width: 768px)"
    />
    <source
      srcset="/BookShelf/assets/books-mobile-D6qNfdS1.webp 1x, /BookShelf/assets/books-mobile@2x-BpsMpCrJ.webp 2x"
      media="(max-width: 767px)"
    />
    <img
      class="list-empty-img"
      src="/BookShelf/assets/books-des-tablet-H5_jeGOx.webp"
      alt="Books image"
      width="265"
      height="198"
    />
  </picture>
</div>

          </div>
        </div>
        <button class="scroll-up" aria-label="Scroll to top of page">
    <svg class="icon-skroll-up">
        <use href="/BookShelf/assets/symbol-defs-1qghD2SQ.svg#icon-scroll-up-arrow"></use>
    </svg>
</button>
      </section>
    </main>
    <dialog class="book-modal"></dialog>
  </body>
</html>
